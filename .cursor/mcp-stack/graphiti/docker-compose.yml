name: graphiti

services:
  graphiti:
    image: zepai/knowledge-graph-mcp:1.1.3
    container_name: graphiti
    restart: unless-stopped
    depends_on: []
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:6379:6379"
    environment:
      OPENAI_API_KEY: ${GRAPHITI_LLM_API_KEY:?GRAPHITI_LLM_API_KEY is required}
      OPENAI_API_URL: ${GRAPHITI_LLM_API_URL:-https://ai.starimg.ru/v1}
      MODEL_NAME: ${GRAPHITI_LLM_MODEL:-deepseek-v4.1-flash-1017}
      LLM_STRUCTURED_OUTPUT_MODE: ${GRAPHITI_STRUCTURED_OUTPUT_MODE:-json_object}
      EMBEDDER_API_URL: ${EMBEDDER_API_URL:-http://host.docker.internal:11434/v1}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-ollama}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-qwen3-embedding:0.6b}
      EMBEDDER_DIMENSIONS: ${EMBEDDER_DIMENSIONS:-1024}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-}
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      BROWSER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/mcp/config/config.yaml:ro
      - falkordb_data:/var/lib/falkordb/data
      - mcp_logs:/var/log/graphiti
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  falkordb_data:
  mcp_logs:
